<div class="blog-page">
    <!-- Schnellauswahl Navbar (dezent im Hintergrund) -->
    <div class="blog-quicknav-container">
        <div class="blog-quicknav-pills" role="navigation" aria-label="Blog Schnellauswahl">
            <button
                *ngFor="let entry of blogEntries; let i = index"
                type="button"
                class="quicknav-pill"
                [class.active]="activeBlogIndex === i"
                (click)="scrollToBlog(i)"
                [attr.aria-label]="'Zum Blog ' + entry.month + ' scrollen'">
                <span>{{ entry.month }}</span>
            </button>
        </div>
    </div>

    <div class="blog-content">
        <div *ngFor="let entry of blogEntries | slice:0:visibleCount; let i = index" [id]="entry.id" class="blog-post-wrapper">
            <ng-container *ngComponentOutlet="entry.component"></ng-container>
        </div>

        <div class="load-more" *ngIf="visibleCount < blogEntries.length" (click)="onLoadMore()">
            <div class="load-more-title">
                Vorherigen Beitrag anzeigen
            </div>
            <svg class="load-more-arrow" width="48" height="14" viewBox="0 0 48 14" fill="none">
                <path d="M3 3L24 12L45 3" stroke="#CAD2C5" stroke-width="3" fill="none" stroke-linecap="round" />
            </svg>
        </div>
    </div>
</div>
